name: MacOS Build

# This workflow builds AirLib component
# Note: macOS support is experimental and may be deprecated
# Note: Does NOT build Unreal Engine plugin (requires UE 5.7 installation)
# For Unreal plugin verification, see docs/UE57_MIGRATION_GUIDE.md

# Controls when the action will run.
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-11, macos-12]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v3

      - name: Remove Python 2 to 3 for Python 3.11 symlink
        run: brew unlink python@3.11 && brew link --overwrite python@3.11 && brew unlink python@3.10 && brew link --overwrite python@3.10

      - name: Setup
        run: ./setup.sh

      - name: Build AirLib
        run: ./build.sh
